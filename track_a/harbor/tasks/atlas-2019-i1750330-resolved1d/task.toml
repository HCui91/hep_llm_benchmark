schema_version = "1.3"
artifacts = ["/app/BENCH_0001.cc", "/app/BENCH_0001.info", "/app/BENCH_0001.plot"]

[task]
name = "hepbench/atlas-2019-i1750330-resolved1d"
description = "Write a Rivet 4 routine from an analysis summary; graded by closure against a reference routine."

[metadata]
category = "hep-analysis"

[agent]
timeout_sec = 3600.0
# NETWORK: on Docker/Podman, Harbor enforces every mode except "public" with an
# egress sidecar whose nftables redirect rule fails under rootless podman on
# the development host ("Could not process rule"). So this task is "public" for now: fine for
# oracle/nop smoke tests, NOT for scored agent runs, which need "allowlist"
# (model API host only) on a host where the sidecar works. See README.md.

[environment]
network_mode = "public"
cpus = 2
memory_mb = 4096
storage_mb = 10240

[verifier]
environment_mode = "separate"
timeout_sec = 1800.0

[verifier.environment]
network_mode = "public"
cpus = 2
memory_mb = 4096
