# Harbor builds its egress-control sidecar FROM an unqualified image name
# (gogost/gost). Podman's default short-name mode refuses that without a TTY.
# Resolve short names on Docker Hub only. Activated by run_harbor.sh via
# CONTAINERS_REGISTRIES_CONF; the global podman config is untouched.
unqualified-search-registries = ["docker.io"]
short-name-mode = "permissive"
