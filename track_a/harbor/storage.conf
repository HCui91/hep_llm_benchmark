# Podman storage for Harbor runs on the development host. Set graphroot and
# runroot to your own user name and UID.
# The default graph root is on the NFS home, which lacks extended attributes, so
# rootless podman cannot unpack image layers there. Use local disk instead.
# Activate per shell, leaving the global podman config alone:
#   export CONTAINERS_STORAGE_CONF=$PWD/track_a/harbor/storage.conf
[storage]
driver = "overlay"
graphroot = "/var/tmp/hcui/containers/storage"
runroot = "/run/user/8587/containers"

# This account has no /etc/subuid or /etc/subgid entries, so podman maps a
# single UID and cannot chown image files to other owners. Ignore those errors:
# every file in a container is then owned by root (= this user on the host).
[storage.options.overlay]
ignore_chown_errors = "true"
